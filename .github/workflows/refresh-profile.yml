name: Refresh profile data

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify profile generator
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Refresh public profile data
        env:
          PROFILE_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_profile.py

      - name: Commit generated profile data
        run: |
          git add README.md generated/programming-stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile data"
          git push
