    .bar { fill: #7fa7da; }
    .bar-accent { fill: #f06f4f; }
    .divider { stroke: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #0d1117; stroke: #30363d; }
      .title, .section, .metric-value { fill: #f0f6fc; }
      .body { fill: #c9d1d9; }
      .muted, .metric-label { fill: #8b949e; }
      .track { fill: #21262d; }
      .divider { stroke: #30363d; }
    }
  </style>
